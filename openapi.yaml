                        - 10
                    "amount":
                      "type": "integer"
                      "format": "int64"
                      "examples":
                        - 1200
                    "amount_spent":
                      "type": "integer"
                      "format": "int64"
                      "examples":
                        - 150
                    "balance":
                      "type": "integer"
                      "format": "int64"
