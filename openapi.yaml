
"openapi": "3.2.0"
"info":
  "title": "Personal Budget API"
  "description": "This is Personal Budget API is created to allow users create and manage a personal budget. It uses the Envelope budgeting principles and allows users to manage budget envelopes and track the balance of each envelope.\n\nIt is built with Express, Nodejs and JavaScript."
  "version": "1.0.13"
"servers":
  -
    "url": "https://localhost:3000/api/"
    "description": "Production server (OAS 3.2)"
  -
    "url": "https://localhost:3000/api/"
    "description": "Staging server"
